<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7c600"><title>Unsubscribe | Football Talk</title><meta name="description" content="Unsubscribe from Football Talk Weekly."><link rel="stylesheet" href="styles.css"><style>body{background:#f3f3f3}.unsub-wrap{max-width:720px;margin:42px auto;padding:0 18px}.unsub-card{background:#fff;border-top:6px solid #f7c600;border-radius:10px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.unsub-card h1{margin:4px 0 12px}.unsub-card p{line-height:1.55;color:#555}.unsub-form{display:grid;gap:12px;margin:20px 0}.unsub-form input{padding:13px 14px;border:1px solid #ccc;border-radius:7px;font:inherit}.unsub-form button{padding:13px 16px;border:0;border-radius:7px;background:#111;color:#fff;font-weight:900;cursor:pointer}.unsub-form button:hover,.unsub-form button:focus{background:#f7c600;color:#111}.status{min-height:22px;font-weight:800}.status.ok{color:#156f31}.status.err{color:#9d1111}</style></head><body><header class="site-header"><a class="brand" href="./"><span class="brand-mark">FT</span><span class="brand-copy"><strong>FOOTBALL TALK</strong><small>WHERE FANS HAVE THEIR SAY</small></span></a></header><main class="unsub-wrap"><section class="unsub-card"><p class="eyebrow dark">FOOTBALL TALK WEEKLY</p><h1>Unsubscribe</h1><p>You can stop Football Talk Weekly at any time. If you arrived here from a newsletter, your subscriber reference is already attached and only one confirmation is needed.</p><form id="unsub-form" class="unsub-form"><input id="email" name="email" type="email" autocomplete="email" placeholder="Your subscribed email address" aria-label="Subscribed email address"><button type="submit">UNSUBSCRIBE FROM FOOTBALL TALK WEEKLY</button><p id="status" class="status" aria-live="polite"></p></form><p><a href="./"><strong>← Back to Football Talk</strong></a></p></section></main><script>(function(){const form=document.getElementById('unsub-form'),email=document.getElementById('email'),status=document.getElementById('status'),id=new URLSearchParams(location.search).get('id')||'';if(id)email.closest('.unsub-form').querySelector('input').style.display='none';form.addEventListener('submit',async e=>{e.preventDefault();status.className='status';status.textContent='Updating your subscription…';const body=id?{id}:{email:email.value.trim().toLowerCase()};try{const r=await fetch('/api/newsletter-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Unable to unsubscribe');status.className='status ok';status.textContent='You have been unsubscribed from Football Talk Weekly.';form.querySelector('button').disabled=true;email.disabled=true}catch(err){status.className='status err';status.textContent='We could not unsubscribe you just yet. Please try again.'}})})();</script></body></html>
