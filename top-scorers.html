<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7c600"><title>Top Scorers | Football Talk</title><meta name="description" content="Football Talk top scorers: leading Premier League goalscorers in a clean Football Talk view."><link rel="stylesheet" href="styles.css?v=20260824-3"><style>body{background:#f3f3f3;color:#111}.wrap{max-width:980px;margin:auto;padding:26px 14px 54px}.hero{background:#0b0b0e;color:#fff;border-radius:18px;padding:24px;margin-bottom:16px}.ey{margin:0 0 6px;color:#f7c600;font-size:11px;font-weight:1000;letter-spacing:.1em}.hero h1{margin:0;font-size:clamp(32px,7vw,56px)}.hero p{margin:9px 0 0;color:#bbb;line-height:1.5}.panel{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.07)}.head,.row{display:grid;grid-template-columns:54px minmax(0,1fr) 72px;gap:10px;align-items:center}.head{background:#111;color:#fff;padding:12px 14px;font-size:11px;font-weight:1000;letter-spacing:.07em}.row{padding:14px;border-bottom:1px solid #ececec}.row:last-child{border-bottom:0}.rank{font-weight:1000;color:#8a6f00}.player{font-weight:900;line-height:1.25}.team{display:block;font-size:11px;color:#777;margin-top:3px}.goals{text-align:right;font-size:22px;font-weight:1000}.goals small{display:block;font-size:9px;color:#777;letter-spacing:.06em}.meta{margin-top:12px;color:#777;font-size:11px;text-align:right}.empty{padding:22px;color:#666}.back{display:inline-block;margin-top:14px;background:#111;color:#fff!important;text-decoration:none;padding:11px 14px;border-radius:10px;font-weight:900}.back:hover{background:#f7c600;color:#111!important}@media(max-width:560px){.wrap{padding:16px 10px 40px}.hero{padding:20px 16px}.head,.row{grid-template-columns:42px minmax(0,1fr) 58px}.row{padding:12px 10px}.goals{font-size:19px}}</style></head><body><header class="site-header"><a class="brand" href="./"><span class="brand-mark">FT</span><span class="brand-copy"><strong>FOOTBALL TALK</strong><small>WHERE FANS HAVE THEIR SAY</small></span></a><button class="menu-button" aria-label="Open menu">☰</button><nav class="nav"></nav></header><div class="quick-nav"></div><main class="wrap"><section class="hero"><p class="ey">GOALS • 2026/27</p><h1>Top Scorers</h1><p>The leading Premier League goalscorers, presented properly inside Football Talk instead of exposing the raw stats feed.</p></section><section class="panel"><div class="head"><div>#</div><div>PLAYER</div><div style="text-align:right">GOALS</div></div><div id="scorers" class="empty">Loading top scorers…</div></section><div id="meta" class="meta"></div><a class="back" href="tables-stats.html">← Tables & Stats</a></main><script src="nav-tabs.js?v=20260909-top-scorers-1"></script><script>(()=>{const box=document.getElementById('scorers'),meta=document.getElementById('meta');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/top-scorers?_='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{const players=Array.isArray(data.players)?data.players:[];if(!players.length){box.className='empty';box.textContent='Top scorer data is temporarily unavailable.';return}box.className='';box.innerHTML=players.map((p,i)=>`<div class="row"><div class="rank">${esc(p.rank||i+1)}</div><div><span class="player">${esc(p.name||'Unknown player')}</span>${p.team?`<span class="team">${esc(p.team)}</span>`:''}</div><div class="goals">${esc(p.goals??0)}<small>GOALS</small></div></div>`).join('');const bits=[];if(data.season)bits.push(`Season ${data.season}`);if(data.source)bits.push(`Source: ${data.source}`);if(data.updatedAt){const d=new Date(data.updatedAt);if(!Number.isNaN(d.getTime()))bits.push(`Updated ${new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/London'}).format(d)}`)}meta.textContent=bits.jo
