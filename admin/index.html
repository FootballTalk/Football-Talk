<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Football Talk Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--y:#f7c600;--b:#0b0b0e;--p:#17171d;--m:#a9a9b2}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#0d0d11;color:#fff}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.brand{font-family:'Archivo Black';font-size:28px}.brand span{background:var(--y);color:#000;padding:6px 9px;margin-right:8px}.panel{background:#17171d;border:1px solid #2a2a32;padding:22px;margin-bottom:22px}.hidden{display:none!important}input,textarea,select{width:100%;background:#0f0f14;color:#fff;border:1px solid #3a3a45;padding:12px;font:inherit}textarea{min-height:130px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}.btn{display:inline-block;border:0;padding:12px 16px;font-weight:900;cursor:pointer;background:var(--y);color:#000;text-decoration:none}.btn.dark{background:#2b2b34;color:#fff}.btn.red{background:#d9272e;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap}.status{padding:10px 12px;background:#101015;border-left:4px solid var(--y);color:#ddd;margin:10px 0}.list{display:grid;gap:12px}.item{background:#111116;border:1px solid #2c2c35;padding:16px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.item h3{margin:2px 0 8px}.meta{font-size:12px;color:var(--m)}label{display:block;font-size:12px;font-weight:800;color:#c8c8cf;margin:0 0 6px}.login{max-width:480px;margin:80px auto}.help{color:#aaa;font-size:13px;line-height:1.5}.preview-img{max-width:220px;max-height:130px;object-fit:cover;margin-top:10px}.admin-shortcuts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.admin-shortcuts .btn{border-radius:8px}.admin-shortcuts .enquiries{background:var(--y);color:#111}@media(max-width:760px){.grid{grid-template-columns:1fr}.item{flex-direction:column}.wrap{padding:16px}.top{align-items:flex-start}.brand{font-size:23px}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><span>FT</span>FOOTBALL TALK ADMIN</div><div class="actions"><a class="btn dark" href="/">View website</a><button id="logoutBtn" class="btn red hidden">Log out</button></div></div><div class="admin-shortcuts"><a class="btn enquiries" href="/admin-advertising.html">📣 Advertising Enquiries</a></div><section id="setupPanel" class="panel hidden"><h2>One-time setup needed</h2><p class="help">Supabase has not been connected yet. Add your Supabase URL and anon key to <b>config.js</b>, then reload this page.</p></section><section id="loginPanel" class="panel login hidden"><h2>Admin sign in</h2><div class="grid"><div class="full"><label>Email</label><input id="email" type="email"></div><div class="full"><label>Password</label><input id="password" type="password"></div><div class="full"><button id="loginBtn" class="btn">Sign in</button></div></div><div id="loginStatus" class="status hidden"></div></section><section id="adminPanel" class="hidden"><div class="panel"><h2 id="formTitle">Create story</h2><div class="grid"><div><label>Type</label><select id="type"><option>News</option><option>Transfer</option><option>It's A Go!</option><option>Matchday</option><option>Full Time</option><option>Fan Debate</option><option>Poll</option></select></div><div><label>Status</label><select id="status"><option value="published">Published</option><option value="draft">Draft</option></select></div><div class="full"><label>Headline</label><input id="title"></div><div class="full"><label>Short summary</label><textarea id="summary"></textarea></div><div class="full"><label>Full article/body</label><textarea id="body"></textarea></div><div><label>Image URL</label><input id="imageUrl" placeholder="Optional if uploading below"></div><div><label>Upload image</label><input id="imageFile" type="file" accept="image/*"></div><div><label>Featured story?</label><select id="featured"><option value="false">No</option><option value="true">Yes</option></select></div><div><label>Publish date/time</label><input id="publishedAt" type="datetime-local"></div><div class="full actions"><button id="saveBtn" class="btn">Publish / Save</button><button id="resetBtn" class="btn dark">Clear form</button></div></div><div id="saveStatus" class="status hidden"></div></div><div class="panel"><h2>Manage stories</h2><div id="storyList" class="list"></div></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script src="admin.js"></script></body></html>
