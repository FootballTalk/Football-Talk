<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7c600"><title>Advertising Enquiries | Football Talk Admin</title><meta name="robots" content="noindex,nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--y:#f7c600;--bg:#09090b;--panel:#151518;--muted:#a8a8ae;--line:#33343a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,Arial,sans-serif}.top{position:sticky;top:0;z-index:5;background:#08080a;border-bottom:4px solid var(--y)}.topin{max-width:1120px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-family:'Archivo Black';font-size:21px}.brand span{color:var(--y)}.actions{display:flex;gap:8px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:900;text-decoration:none;cursor:pointer;font-family:inherit}.btn.yellow{background:var(--y);color:#111}.btn.dark{background:#25252b;color:#fff}.wrap{max-width:1120px;margin:auto;padding:25px 16px 60px}.hero{border:2px solid var(--y);border-radius:18px;padding:25px;background:linear-gradient(135deg,#18181c,#0e0e11);margin-bottom:20px}.eyebrow{color:var(--y);font-size:12px;font-weight:900;letter-spacing:.1em}.hero h1{font-family:'Archivo Black';font-size:clamp(32px,7vw,58px);margin:9px 0 8px;line-height:1}.hero p{color:#c3c3c8;line-height:1.5;margin:0;max-width:760px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.count{font-weight:900}.status{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px}.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:14px}.business{font-size:22px;font-weight:900}.date{font-size:12px;color:#8e8e95;text-align:right;white-space:nowrap}.package{display:inline-block;background:var(--y);color:#111;font-size:12px;font-weight:900;border-radius:999px;padding:6px 9px;margin-top:6px}.details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.item{background:#0d0d10;border:1px solid #2d2e33;border-radius:10px;padding:11px}.item.full{grid-column:1/-1}.label{display:block;color:#888891;font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}.value{color:#eee;overflow-wrap:anywhere;line-height:1.45}.value a{color:var(--y)}.message{white-space:pre-wrap}.empty,.gate{background:#111114;border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;color:#bbb}.gate strong{display:block;color:#fff;font-size:21px;margin-bottom:8px}.hidden{display:none!important}@media(max-width:760px){.grid{grid-template-columns:1fr}.details{grid-template-columns:1fr}.item.full{grid-column:auto}.topin{padding:11px}.brand{font-size:17px}.btn{font-size:12px;padding:9px}.hero{padding:20px}.toolbar{align-items:flex-start;flex-direction:column}}</style></head><body><header class="top"><div class="topin"><div class="brand"><span>FT</span> ADMIN · ADVERTISING</div><div class="actions"><a class="btn dark" href="index.html">Website</a><a class="btn yellow" href="admin.html">Admin</a></div></div></header><main class="wrap"><section class="hero"><div class="eyebrow">PRIVATE ADMIN AREA</div><h1>ADVERTISING ENQUIRIES</h1><p>View sponsorship and advertising enquiries submitted through Football Talk. Newest submissions appear first.</p></section><div id="gate" class="gate"><strong>Checking admin access…</strong><span>Please wait.</span></div><section id="dashboard" class="hidden"><div class="toolbar"><div class="count" id="count">0 enquiries</div><div class="status" id="status">Loading…</div></div><div class="grid" id="grid"></div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const SESSION_KEY='football-talk-member-session';const gate=document.getElementById('gate'),dash=document.getElementById('dashboard'),grid=document.getElementById('grid'),count=document.getElementById('count'),status=document.getElementById('status');function session(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function linkify(v){if(!v)return '—';const s=String(v);const href=/^https?:\/\//i.test(s)?s:'https://'+s;return '<a href="'+esc(href)+'" target="_blank" rel="noopener">'+esc(s)+'</a>'}function fmt(d){try{return new Intl.DateTimeFormat('en-GB',{dateStyle:'medium',timeStyle:'short'}).format(new Date(d))}catch{return d||''}}async function run(){const cfg=window.FT_CONFIG||{},s=session();if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase){gate.innerHTML='<strong>Dashboard unavailable</strong><span>Football Talk configuration could not be loaded.</span>';return}if(!s?.access_token){gate.innerHTML='<strong>Admin sign-in required</strong><span><a href="account.html?next=admin-advertising.html" style="color:#f7c600">Sign in to Football Talk</a></span>';return}const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{global:{headers:{Authorization:'Bearer '+s.access_token}}});const {data:{user},error:userErr}=await client.auth.getUser(s.access_token);if(userErr||!user){gate.innerHTML='<strong>Session expired</strong><span><a href="account.html?next=admin-advertising.html" style="color:#f7c600">Sign in again</a></span>';return}const role=user.app_metadata?.role;if(role!=='admin'){gate.innerHTML='<strong>Admin access only</strong><span>This account is not authorised to view advertising enquiries.</span>';return}gate.classList.add('hidden');dash.classList.remove('hidden');const {data,error}=await client.from('advertising_enquiries').select('id,contact_name,business,email,link,package,message,created_at').order('created_at',{ascending:false});if(error){status.textContent='Could not load enquiries';grid.innerHTML='<div class="empty">Database access is not enabled for the admin dashboard yet.</div>';console.error(error);return}count.textContent=(data?.length||0)+' '+((data?.length||0)===1?'enquiry':'enquiries');status.textContent='Updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});if(!data?.length){grid.innerHTML='<div class="empty">No advertising enquiries yet.</div>';return}grid.innerHTML=data.map(r=>'<article class="card"><div class="cardhead"><div><div class="business">'+esc(r.business)+'</div><span class="package">'+esc(r.package)+'</span></div><div class="date">'+esc(fmt(r.created_at))+'</div></div><div class="details"><div class="item"><span class="label">Contact</span><div class="value">'+esc(r.contact_name)+'</div></div><div class="item"><span class="label">Email</span><div class="value"><a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></div></div><div class="item full"><span class="label">Website / social</span><div class="value">'+linkify(r.link)+'</div></div><div class="item full"><span class="label">Message</span><div class="value message">'+esc(r.message)+'</div></div></div></article>').join('')}run().catch(e=>{console.error(e);gate.innerHTML='<strong>Could not open dashboard</strong><span>Please sign in again and retry.</span>'})})();</script></body></html>
