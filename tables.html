<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7c600"><title>Tables | Football Talk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--yellow:#f7c600;--black:#0b0b0e}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f4f4;color:#111}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;background:var(--black);color:#fff;border-bottom:4px solid var(--yellow);padding:14px 18px}.brand{display:flex;align-items:center;gap:12px}.mark{display:flex;align-items:center;justify-content:center;width:46px;height:46px;background:var(--yellow);color:#000;font-family:'Archivo Black';font-size:23px;transform:skew(-8deg)}.brand strong{font-family:'Archivo Black';display:block}.brand small{font-size:10px;letter-spacing:1.2px;color:#ccc}.close{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--yellow);color:#000;font-size:34px;font-weight:900;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:34px 18px 70px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:2px;color:#8a6e00}.title{font-family:'Archivo Black';font-size:clamp(38px,7vw,70px);margin:4px 0 8px}.sub{color:#666;margin:0 0 18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}.tab-btn{appearance:none;border:2px solid #111;background:#fff;color:#111;padding:12px 10px;font-weight:900;border-radius:8px;cursor:pointer}.tab-btn.active{background:var(--yellow);border-color:var(--yellow)}.status{font-size:13px;font-weight:800;margin-bottom:18px}.league{background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.07);border-top:6px solid var(--yellow)}.league-head{padding:20px 18px 12px}.league h2{font-family:'Archivo Black';margin:0;font-size:30px}.updated{font-size:12px;color:#777;font-weight:700;margin-top:6px}.table-scroll{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;min-width:700px}.tbl th{background:#111;color:#fff;font-size:12px;text-transform:uppercase;padding:10px 8px;text-align:center}.tbl th.team,.tbl td.team{text-align:left}.tbl td{padding:10px 8px;border-bottom:1px solid #e6e6e6;text-align:center;font-size:14px}.tbl td.pos{font-weight:900;width:42px}.tbl td.team{font-weight:800}.tbl td.pts{font-weight:1000}.tbl tr:nth-child(even){background:#fafafa}.empty{padding:18px}.team-wrap{display:flex;align-items:center;gap:8px}.team-logo{width:22px;height:22px;object-fit:contain}@media(max-width:650px){.wrap{padding:24px 10px 60px}.league-head{padding-left:12px}.tbl td,.tbl th{padding:9px 6px;font-size:12px}.title{font-size:42px}.brand small{display:none}.tab-btn{font-size:13px}}</style></head><body><header class="top"><div class="brand"><span class="mark">FT</span><span><strong>FOOTBALL TALK</strong><small>WHERE FANS HAVE THEIR SAY</small></span></div><a class="close" href="./" aria-label="Close tables and return to Football Talk">×</a></header><main class="wrap"><p class="eyebrow">TABLES & STANDINGS</p><h1 class="title">League Tables</h1><p class="sub">Current Premier League and EFL Championship standings, updated automatically.</p><div class="tabs" role="tablist" aria-label="League tables"><button class="tab-btn active" type="button" role="tab" aria-selected="true" data-league="39">Premier League</button><button class="tab-btn" type="button" role="tab" aria-selected="false" data-league="40">Championship</button></div><div id="tables-status" class="status">Loading latest standings…</div><section class="league"><div class="league-head"><h2 id="league-name">Premier League</h2><div id="updated" class="updated"></div></div><div class="table-scroll"><table class="tbl"><thead><tr><th>Pos</th><th class="team">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody id="table-body"></tbody></table></div><div id="table-empty" class="empty" hidden>No standings are available yet.</div></section></main><script>(()=>{const buttons=[...document.querySelectorAll('.tab-btn')];const tbody=document.getElementById('table-body');const empty=document.getElementById('table-empty');const status=document.getElementById('tables-status');const title=document.getElementById('league-name');const updated=document.getElementById('updated');let activeLeague=39;let leagues=[];function render(){const league=leagues.find(l=>Number(l.id)===activeLeague);const name=activeLeague===39?'Premier League':'Championship';title.textContent=name;tbody.replaceChildren();if(!league||!league.standings?.length){empty.hidden=false;status.textContent=`No ${name} standings are available yet.`;return}empty.hidden=true;league.standings.forEach(r=>{const tr=document.createElement('tr');const teamCell=document.createElement('td');teamCell.className='team';const wrap=document.createElement('div');wrap.className='team-wrap';if(r.logo){const img=document.createElement('img');img.src=r.logo;img.alt='';img.className='team-logo';wrap.appendChild(img)}const teamName=document.createElement('span');teamName.textContent=r.team||'';wrap.appendChild(teamName);teamCell.appendChild(wrap);const cells=[['pos',r.rank],null,['',r.played],['',r.win],['',r.draw],['',r.lose],['',r.goalsFor],['',r.goalsAgainst],['',r.goalsDiff>0?`+${r.goalsDiff}`:r.goalsDiff],['pts',r.points]];cells.forEach((c,i)=>{if(i===1){tr.appendChild(teamCell);return}const td=document.createElement('td');if(c[0])td.className=c[0];td.textContent=c[1]??'';tr.appendChild(td)});tbody.appendChild(tr)});status.textContent=`${name} table · automatic`;}
buttons.forEach(btn=>btn.addEventListener('click',()=>{activeLeague=Number(btn.dataset.league);buttons.forEach(b=>{const on=b===btn;b.classList.toggle('active',on);b.setAttribute('aria-selected',String(on))});render()}));async function load(){try{const r=await fetch(`/api/standings?t=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('standings unavailable');const data=await r.json();leagues=data.leagues||[];updated.textContent=`Updated ${new Date(data.updatedAt).toLocaleString('en-GB',{timeZone:'Europe/London',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}`;render()}catch(e){status.textContent='League tables are temporarily unavailable.';tbody.replaceChildren();empty.hidden=false;empty.textContent='Football Talk could not load the latest standings right now. Please try again shortly.'}}load();setInterval(load,300000)})();</script></body></html>
