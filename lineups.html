<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7c600"><title>Lineups | Football Talk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>:root{--yellow:#f7c600;--black:#0b0b0e}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f4f4;color:#111}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;background:var(--black);color:#fff;border-bottom:4px solid var(--yellow);padding:14px 18px}.brand{display:flex;align-items:center;gap:12px}.mark{display:flex;align-items:center;justify-content:center;width:46px;height:46px;background:var(--yellow);color:#000;font-family:'Archivo Black';font-size:23px;transform:skew(-8deg)}.brand strong{font-family:'Archivo Black';display:block}.brand small{font-size:10px;letter-spacing:1.2px;color:#ccc}.close{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--yellow);color:#000;font-size:34px;font-weight:900;text-decoration:none}.wrap{max-width:1100px;margin:auto;padding:34px 18px 70px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:2px;color:#8a6e00}.title{font-family:'Archivo Black';font-size:clamp(38px,7vw,70px);margin:4px 0 8px}.sub{color:#666;margin:0 0 18px;line-height:1.5}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 18px}.tab-btn{appearance:none;border:2px solid #111;background:#fff;color:#111;padding:12px 10px;font-weight:900;border-radius:8px;cursor:pointer}.tab-btn.active{background:var(--yellow);border-color:var(--yellow)}.status{font-size:13px;font-weight:800;margin-bottom:18px}.match-list{display:grid;gap:18px}.match{background:#fff;border-top:6px solid var(--yellow);box-shadow:0 8px 22px rgba(0,0,0,.07)}.match-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px;background:#111;color:#fff}.team{text-align:center;font-weight:900}.team img{width:34px;height:34px;object-fit:contain;display:block;margin:0 auto 6px}.kick{text-align:center}.kick strong{display:block;color:var(--yellow);font-size:18px}.kick small{color:#ccc}.lineups{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px}.side{min-width:0}.side h3{margin:0 0 5px;font-family:'Archivo Black';font-size:22px}.meta{font-size:12px;color:#666;font-weight:700;margin-bottom:12px}.list-title{font-weight:900;margin:14px 0 8px}.players{display:grid;gap:6px}.player{display:flex;justify-content:space-between;gap:10px;padding:7px 9px;background:#f7f7f7;border-left:3px solid var(--yellow);font-size:13px}.pending{padding:20px;text-align:center;color:#666;font-weight:800}.empty{background:#fff;border-top:5px solid var(--yellow);padding:20px;box-shadow:0 8px 20px rgba(0,0,0,.06)}@media(max-width:700px){.wrap{padding:24px 10px 60px}.title{font-size:42px}.brand small{display:none}.match-head{grid-template-columns:1fr 70px 1fr}.lineups{grid-template-columns:1fr}.team{font-size:13px}.team img{width:28px;height:28px}.tab-btn{font-size:13px}}</style></head><body><header class="top"><div class="brand"><span class="mark">FT</span><span><strong>FOOTBALL TALK</strong><small>WHERE FANS HAVE THEIR SAY</small></span></div><a class="close" href="./" aria-label="Close lineups and return to Football Talk">×</a></header><main class="wrap"><p class="eyebrow">MATCHDAY TEAM NEWS</p><h1 class="title">Lineups</h1><p class="sub">Today’s Premier League and Championship team sheets. Starting XIs, substitutes, formations and coaches appear automatically as soon as they are published.</p><div class="tabs" role="tablist" aria-label="Lineups competitions"><button class="tab-btn active" type="button" data-league="39" aria-selected="true">Premier League</button><button class="tab-btn" type="button" data-league="40" aria-selected="false">Championship</button></div><div id="status" class="status">Checking today’s team sheets…</div><section id="matches" class="match-list"></section></main><script>(()=>{const buttons=[...document.querySelectorAll('.tab-btn')];const list=document.getElementById('matches');const status=document.getElementById('status');let fixtures=[];let activeLeague=39;const fmtTime=d=>new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(d));function playerList(title,players){const box=document.createElement('div');const h=document.createElement('div');h.className='list-title';h.textContent=title;box.appendChild(h);const rows=document.createElement('div');rows.className='players';players.forEach(p=>{const r=document.createElement('div');r.className='player';const name=document.createElement('span');name.textContent=`${p.number??''}${p.number?' · ':''}${p.name||''}`;const pos=document.createElement('span');pos.textContent=p.pos||'';r.append(name,pos);rows.appendChild(r)});box.appendChild(rows);return box}function side(team){const d=document.createElement('div');d.className='side';const h=document.createElement('h3');h.textContent=team.team||'';const meta=document.createElement('div');meta.className='meta';meta.textContent=[team.formation?`Formation ${team.formation}`:'',team.coach?`Coach: ${team.coach}`:''].filter(Boolean).join(' · ');d.append(h,meta,playerList('Starting XI',team.startXI||[]),playerList('Substitutes',team.substitutes||[]));return d}function render(){list.replaceChildren();const filtered=fixtures.filter(f=>Number(f.leagueId)===activeLeague);const leagueName=activeLeague===39?'Premier League':'Championship';if(!filtered.length){const e=document.createElement('div');e.className='empty';e.textContent=`No ${leagueName} fixtures are scheduled today.`;list.appendChild(e);status.textContent=`No ${leagueName} lineups due today.`;return}let announced=0;filtered.forEach(f=>{const m=document.createElement('article');m.className='match';const head=document.createElement('div');head.className='match-head';const home=document.createElement('div');home.className='team';if(f.homeLogo){const i=document.createElement('img');i.src=f.homeLogo;i.alt='';home.appendChild(i)}home.append(document.createTextNode(f.home||''));const kick=document.createElement('div');kick.className='kick';const ks=document.createElement('strong');ks.textContent=fmtTime(f.date);const ksm=document.createElement('small');ksm.textContent=f.status==='FT'?'FT':f.status==='NS'?'KO':'Matchday';kick.append(ks,ksm);const away=document.createElement('div');away.className='team';if(f.awayLogo){const i=document.createElement('img');i.src=f.awayLogo;i.alt='';away.appendChild(i)}away.append(document.createTextNode(f.away||''));head.append(home,kick,away);m.appendChild(head);if((f.lineups||[]).length>=2){announced++;const lu=document.createElement('div');lu.className='lineups';lu.append(side(f.lineups[0]),side(f.lineups[1]));m.appendChild(lu)}else{const p=document.createElement('div');p.className='pending';p.textContent='Lineups not announced yet — this page will update automatically.';m.appendChild(p)}list.appendChild(m)});status.textContent=`${leagueName}: ${announced} of ${filtered.length} lineup${filtered.length===1?'':'s'} announced · automatic`;}
buttons.forEach(b=>b.addEventListener('click',()=>{activeLeague=Number(b.dataset.league);buttons.forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-selected',String(on))});render()}));async function load(){try{const r=await fetch('/api/lineups',{cache:'no-store'});if(!r.ok)throw new Error();const data=await r.json();fixtures=data.fixtures||[];render()}catch(_){status.textContent='Lineups are temporarily unavailable.';list.innerHTML='<div class="empty">Football Talk could not load today’s team sheets right now. Please try again shortly.</div>'}}load();setInterval(load,60000)})();</script></body></html>
