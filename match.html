<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7c600"><title>Match Centre | Football Talk</title><link rel="stylesheet" href="styles.css?v=20260824-3"><style>
body{background:#f3f3f3;color:#111}.mc-wrap{max-width:1060px;margin:0 auto;padding:24px 14px 60px}.mc-hero{background:#0b0b0e;color:#fff;border-radius:20px;padding:22px;box-shadow:0 12px 32px rgba(0,0,0,.14)}.mc-kicker{font-size:11px;font-weight:1000;letter-spacing:.09em;color:#f7c600;margin:0 0 10px}.mc-scoreline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:16px}.mc-team{text-align:center;font-weight:950;font-size:clamp(18px,3.5vw,30px)}.mc-team img{display:block;width:64px;height:64px;object-fit:contain;margin:0 auto 8px}.mc-score{text-align:center;font-family:'Archivo Black',Inter,sans-serif;font-size:clamp(30px,7vw,58px);white-space:nowrap}.mc-status{text-align:center;color:#f7c600;font-weight:1000;margin-top:5px}.mc-meta{text-align:center;color:#bbb;font-size:12px;margin-top:14px}.mc-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:14px}.mc-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 7px 20px rgba(0,0,0,.06)}.mc-card h2{margin:0 0 14px;font-size:21px}.mc-event{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.mc-event:last-child{border-bottom:0}.mc-minute{font-weight:1000;color:#8a6f00}.mc-event strong{display:block}.mc-event small{color:#666}.mc-lineups{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mc-lineup{border:1px solid #e4e4e4;border-radius:12px;padding:13px}.mc-lineup-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}.mc-lineup-head img{width:30px;height:30px;object-fit:contain}.mc-lineup h3{margin:0;font-size:16px}.mc-lineup ul{list-style:none;padding:0;margin:8px 0 0}.mc-lineup li{font-size:12px;padding:5px 0;border-bottom:1px solid #eee}.mc-lineup li:last-child{border-bottom:0}.mc-subhead{margin-top:12px;font-size:11px;font-weight:1000;color:#777;letter-spacing:.06em}.mc-stats{display:grid;gap:9px}.mc-stat{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;gap:8px;font-size:12px}.mc-stat .label{text-align:center;font-weight:900;color:#555}.mc-stat .home{text-align:right;font-weight:900}.mc-stat .away{text-align:left;font-weight:900}.mc-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.mc-links a{background:#111;color:#fff!important;text-decoration:none;text-align:center;padding:12px 8px;border-radius:9px;font-weight:900;font-size:12px}.mc-links a:hover{background:#f7c600;color:#111!important}.mc-empty{color:#666;line-height:1.5}.mc-refresh{font-size:10px;color:#888;text-align:right;margin-top:8px}.mc-live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#36d477;margin-right:5px}@media(max-width:760px){.mc-scoreline{grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);gap:6px}.mc-team{font-size:14px}.mc-team img{width:46px;height:46px}.mc-score{font-size:30px}.mc-grid{grid-template-columns:1fr}.mc-lineups{grid-template-columns:1fr}.mc-stat{grid-template-columns:1fr 88px 1fr}.mc-links{grid-template-columns:1fr}}
</style></head><body><header class="site-header"><a class="brand" href="./"><span class="brand-mark">FT</span><span class="brand-copy"><strong>FOOTBALL TALK</strong><small>WHERE FANS HAVE THEIR SAY</small></span></a><button class="menu-button" aria-label="Open menu">☰</button><nav class="nav"></nav></header><div class="quick-nav" aria-label="Quick links"></div><main class="mc-wrap"><section id="hero" class="mc-hero"><p class="mc-kicker">FT MATCH CENTRE</p><div class="mc-empty" style="color:#bbb">Loading match…</div></section><div class="mc-grid"><section class="mc-card"><h2>Match Timeline</h2><div id="events" class="mc-empty">Loading incidents…</div></section><section class="mc-card"><h2>Match Stats</h2><div id="stats" class="mc-empty">Loading statistics…</div></section></div><section class="mc-card" style="margin-top:14px"><h2>Teams & Lineups</h2><div id="lineups" class="mc-empty">Lineups will appear here when available.</div></section><div class="mc-links"><a href="fixtures.html">Fixtures & Results</a><a href="tables-stats.html">League Tables</a><a href="section.html?view=debate">Fan Reaction</a></div><div id="updated" class="mc-refresh"></div></main><script src="nav-tabs.js?v=20260831-hubs-1"></script><script>
(()=>{const q=new URLSearchParams(location.search),id=q.get('id');const hero=document.getElementById('hero'),events=document.getElementById('events'),stats=document.getElementById('stats'),lineups=document.getElementById('lineups'),updated=document.getElementById('updated');const live=new Set(['1H','2H','HT','ET','P','LIVE','INT','BT']);const finished=new Set(['FT','AET','PEN']);let busy=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function statusText(f){const s=String(f.status||'NS').toUpperCase();if(live.has(s))return `<span class="mc-live-dot"></span>${s==='HT'?'HALF-TIME':f.elapsed?`LIVE · ${f.elapsed}′`:'LIVE'}`;if(finished.has(s))return s==='FT'?'FULL-TIME':s;return f.date?new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(f.date)):'UPCOMING'}function scoreText(f){return(f.homeGoals!=null&&f.awayGoals!=null)?`${f.homeGoals} – ${f.awayGoals}`:'v'}function icon(e){const t=(e.type+' '+e.detail).toLowerCase();if(t.includes('goal'))return'⚽';if(t.includes('card'))return t.includes('red')?'🟥':'🟨';if(t.includes('subst'))return'🔄';if(t.includes('var'))return'📺';return'•'}function draw(p){const f=p.fixture||{};document.title=`${f.home||'Match'} v ${f.away||''} | Football Talk`;hero.innerHTML=`<p class="mc-kicker">${live.has(String(f.status||'').toUpperCase())?'● LIVE NOW':'FT MATCH CENTRE'} · ${esc(f.league||'Football')}</p><div class="mc-scoreline"><div class="mc-team">${f.homeLogo?`<img src="${esc(f.homeLogo)}" alt="${esc(f.home)} badge" onerror="this.remove()">`:''}${esc(f.home)}</div><div><div class="mc-score">${esc(scoreText(f))}</div><div class="mc-status">${statusText(f)}</div></div><div class="mc-team">${f.awayLogo?`<img src="${esc(f.awayLogo)}" alt="${esc(f.away)} badge" onerror="this.remove()">`:''}${esc(f.away)}</div></div><div class="mc-meta">${esc([f.round,f.venue,f.referee?`Ref: ${f.referee}`:''].filter(Boolean).join(' · '))}</div>`;const ev=(p.events||[]).slice().sort((a,b)=>(a.minute||0)-(b.minute||0));events.innerHTML=ev.length?ev.map(e=>`<div class="mc-event"><div class="mc-minute">${e.minute!=null?e.minute+'′':''}</div><div><strong>${icon(e)} ${esc(e.player||e.type||'Match event')}</strong><small>${esc([e.team,e.assist?`Assist: ${e.assist}`:'',e.detail].filter(Boolean).join(' · '))}</small></div></div>`).join(''):'<div class="mc-empty">No match incidents are available yet.</div>';const st=p.stats||[];if(st.length>=2){const keys=[...new Set([...Object.keys(st[0].stats||{}),...Object.keys(st[1].stats||{})])].filter(k=>st[0].stats?.[k]!=null||st[1].stats?.[k]!=null).slice(0,14);stats.innerHTML=keys.length?`<div class="mc-stats">${keys.map(k=>`<div class="mc-stat"><div class="home">${esc(st[0].stats?.[k]??'—')}</div><div class="label">${esc(k)}</div><div class="away">${esc(st[1].stats?.[k]??'—')}</div></div>`).join('')}</div>`:'<div class="mc-empty">Statistics are not available yet.</div>'}else stats.innerHTML='<div class="mc-empty">Statistics are not available yet.</div>';const ls=p.lineups||[];lineups.innerHTML=ls.length?`<div class="mc-lineups">${ls.slice(0,2).map(l=>`<div class="mc-lineup"><div class="mc-lineup-head">${l.logo?`<img src="${esc(l.logo)}" alt="">`:''}<div><h3>${esc(l.team)}</h3><small>${esc([l.formation,l.coach?`Coach: ${l.coach}`:''].filter(Boolean).join(' · '))}</small></div></div><div class="mc-subhead">STARTING XI</div><ul>${(l.startXI||[]).map(x=>`<li>${esc(x.number?x.number+'. ':'')}${esc(x.name)}${x.pos?` · ${esc(x.pos)}`:''}</li>`).join('')||'<li>Not available</li>'}</ul><div class="mc-subhead">SUBSTITUTES</div><ul>${(l.substitutes||[]).map(x=>`<li>${esc(x.number?x.number+'. ':'')}${esc(x.name)}</li>`).join('')||'<li>Not available</li>'}</ul></div>`).join('')}</div>`:'<div class="mc-empty">Lineups are not available yet. They will appear automatically when the teams are confirmed.</div>';updated.textContent=p.updatedAt?`Updated ${new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'}).format(new Date(p.updatedAt))}`:''}async function load(){if(!id){hero.innerHTML='<p class="mc-kicker">FT MATCH CENTRE</p><div class="mc-empty" style="color:#bbb">No match was selected.</div>';return}if(busy)return;busy=true;try{const r=await fetch(`/api/match?id=${encodeURIComponent(id)}&_=${Date.now()}`,{cache:'no-store'}),p=await r.json();if(!r.ok)throw new Error(p.error||'Match unavailable');draw(p)}catch(e){hero.innerHTML=`<p class="mc-kicker">FT MATCH CENTRE</p><div class="mc-empty" style="color:#bbb">This match centre could not be loaded right now.</div>`}finally{busy=false}}load();setInterval(load,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});})();
</script></body></html>
